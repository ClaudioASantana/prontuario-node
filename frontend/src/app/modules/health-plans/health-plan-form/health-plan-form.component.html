<div class="row">
  <div class="col-12 col-md-8 offset-md-2">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">{{ isEditMode() ? ('HEALTH_PLANS.FORM.EDIT_TITLE' | translate) : ('HEALTH_PLANS.FORM.ADD_TITLE' | translate) }}</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">

          <div class="mb-3">
            <label class="form-label">{{ 'HEALTH_PLANS.FORM.NAME' | translate }} *</label>
            <input type="text" class="form-control" formControlName="name"
                   [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'HEALTH_PLANS.FORM.CODE' | translate }} *</label>
              <input type="text" class="form-control" formControlName="code"
                   [class.is-invalid]="form.get('code')?.invalid && form.get('code')?.touched">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'HEALTH_PLANS.FORM.COMMERCIAL_NAME' | translate }}</label>
              <input type="text" class="form-control" formControlName="commercialName">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">{{ 'HEALTH_PLANS.FORM.TYPE' | translate }} *</label>
            <select class="form-select" formControlName="type">
              @for (type of planTypes; track type) {
                <option [value]="type">{{ type }}</option>
              }
            </select>
          </div>

          <div class="mb-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" formControlName="active">
              <label class="form-check-label">{{ 'HEALTH_PLANS.FORM.ACTIVE' | translate }}</label>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light" routerLink="/health-plans">{{ 'HEALTH_PLANS.FORM.CANCEL' | translate }}</button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
              {{ isEditMode() ? ('HEALTH_PLANS.FORM.SAVE' | translate) : ('HEALTH_PLANS.FORM.CREATE' | translate) }}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
